name: Vennyx Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        default: "latest"
        description: "Which tag to use for publishing"
        required: true
        options:
          - latest
          - beta
          - alpha
          - next
  push:
    branches:
      - develop
      - vennyx
    paths-ignore:
      - "docs/**"
      - "www/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-publish:
    name: Build and Publish to Vennyx Organization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vennyx-org'

      - name: Create GitHub .npmrc
        run: |
          cat << EOF > .npmrc
          @vennyx-org:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          EOF

      - name: Install Dependencies
        run: yarn

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Build packages
        run: yarn build

      - name: Debug packages structure
        run: |
          echo "Listing all package.json files to debug folder structure:"
          find . -name "package.json" -not -path "*/node_modules/*" | tee package_files.txt
          echo "Checking workspace packages configuration:"
          grep -A 20 "workspaces" package.json || echo "No workspaces found"

      - name: Update package.json files
        run: |
          echo "Starting package.json update process..."
          
          while IFS= read -r pkg_file; do
            if [[ $pkg_file != *"node_modules"* ]]; then
              echo "=== Processing $pkg_file ==="
              
              # Check if package exists
              if [ ! -f "$pkg_file" ]; then
                echo "Warning: File $pkg_file does not exist, skipping"
                continue
              fi

              # Check if package is private
              if grep -q "\"private\":\s*true" "$pkg_file"; then
                echo "Package is private, skipping"
                continue
              fi
              
              # Get the original name from package.json
              ORIGINAL_NAME=$(jq -r '.name' "$pkg_file")
              if [ -z "$ORIGINAL_NAME" ] || [ "$ORIGINAL_NAME" = "null" ]; then
                echo "Warning: Could not determine package name for $pkg_file, skipping"
                continue
              fi
              
              echo "Processing package: $ORIGINAL_NAME"
              
              # Create the new name
              if [[ "$ORIGINAL_NAME" == @* ]]; then
                # For scoped packages
                NEW_NAME="@vennyx-org${ORIGINAL_NAME#*@*}"
              else
                # For regular packages
                NEW_NAME="@vennyx-org/$ORIGINAL_NAME"
              fi
              
              echo "Renaming $ORIGINAL_NAME to $NEW_NAME"
              
              # Get relative directory path for repository field
              DIR_PATH=$(dirname "$pkg_file" | sed "s|$(pwd)/||")
              
              # Update package.json with jq
              cat "$pkg_file" | jq --arg name "$NEW_NAME" \
                                   --arg url "https://github.com/vennyx-org/medusa.git" \
                                   --arg dir "$DIR_PATH" \
                                   '.name = $name | .repository = {type: "git", url: $url, directory: $dir} | .publishConfig = {registry: "https://npm.pkg.github.com", access: "restricted"}' > tmp.json
              
              # Verify the updated JSON is valid
              if jq empty tmp.json; then
                mv tmp.json "$pkg_file"
                echo "✅ Successfully updated package.json for $ORIGINAL_NAME to $NEW_NAME"
              else
                echo "❌ Error: Generated invalid JSON for $pkg_file, skipping"
                rm tmp.json
              fi
            fi
          done < <(find packages -name "package.json" -not -path "*/node_modules/*" -type f)

      - name: Publish packages
        run: |
          echo "Starting package publishing process..."
          
          export SUCCESS_COUNT=0
          export FAIL_COUNT=0
          
          while IFS= read -r pkg_file; do
            if [[ $pkg_file != *"node_modules"* ]]; then
              PKG_DIR=$(dirname "$pkg_file")
              echo "===== Checking package in $PKG_DIR ====="
              
              # Verify package.json exists
              if [ ! -f "$pkg_file" ]; then
                echo "Warning: File $pkg_file does not exist, skipping"
                continue
              fi
              
              # Check if package is private
              if grep -q "\"private\":\s*true" "$pkg_file"; then
                echo "Package is private, skipping"
                continue
              fi
              
              # Get package info for logging
              PKG_NAME=$(jq -r '.name' "$pkg_file")
              PKG_VERSION=$(jq -r '.version' "$pkg_file")
              
              echo "Publishing $PKG_NAME@$PKG_VERSION from $PKG_DIR"
              
              # Navigate to package directory and publish
              pushd "$PKG_DIR" > /dev/null
              
              if npm publish --access restricted --tag ${{ github.event.inputs.version || 'latest' }}; then
                echo "✅ Successfully published $PKG_NAME@$PKG_VERSION"
                export SUCCESS_COUNT=$((SUCCESS_COUNT+1))
              else
                echo "❌ Failed to publish $PKG_NAME"
                export FAIL_COUNT=$((FAIL_COUNT+1))
              fi
              
              popd > /dev/null
            fi
          done < <(find packages -name "package.json" -not -path "*/node_modules/*" -type f)
          
          echo "Publishing complete: $SUCCESS_COUNT packages published successfully, $FAIL_COUNT failed"
          
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::warning::$FAIL_COUNT packages failed to publish"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}