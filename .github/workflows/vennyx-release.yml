name: Vennyx Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        default: "latest"
        description: "Which tag to use for publishing"
        required: true
        options:
          - latest
          - beta
          - alpha
          - next
  push:
    branches:
      - develop
      - vennyx
    paths-ignore:
      - "docs/**"
      - "www/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-publish:
    name: Build and Publish to Vennyx Organization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vennyx-org'

      - name: Create GitHub .npmrc
        run: |
          cat << EOF > .npmrc
          @vennyx-org:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          EOF

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Dependencies
        run: yarn

      - name: Update package.json files - Part 1 (Names only)
        run: |
          echo "Starting step 1: Update package names only..."
          
          # First pass: Just update the package names
          find packages -name "package.json" -not -path "*/node_modules/*" -type f | while read -r pkg_file; do
            # Check if package is private
            if ! grep -q "\"private\":\s*true" "$pkg_file"; then
              # Get the original name
              ORIGINAL_NAME=$(jq -r '.name' "$pkg_file")
              
              if [ -n "$ORIGINAL_NAME" ] && [ "$ORIGINAL_NAME" != "null" ]; then
                # Create the new name
                if [[ "$ORIGINAL_NAME" == @* ]]; then
                  # For scoped packages
                  NEW_NAME="@vennyx-org${ORIGINAL_NAME#*@*}"
                else
                  # For regular packages
                  NEW_NAME="@vennyx-org/$ORIGINAL_NAME"
                fi
                
                echo "Renaming $ORIGINAL_NAME to $NEW_NAME"
                
                # Only update the name
                jq --arg name "$NEW_NAME" '.name = $name' "$pkg_file" > tmp.json && mv tmp.json "$pkg_file"
              fi
            fi
          done
          
          echo "Step 1 complete: Package names updated"

      - name: Update dependencies references
        run: |
          echo "Starting step 2: Update all dependency references..."
          
          # Create a list of package names and their new names
          echo "Creating mapping of original to new names..."
          declare -A PKG_MAP
          
          # Build the package map
          find packages -name "package.json" -not -path "*/node_modules/*" -type f | while read -r pkg_file; do
            if ! grep -q "\"private\":\s*true" "$pkg_file"; then
              OLD_NAME=$(jq -r '.name | gsub("@vennyx-org/"; "")' "$pkg_file")
              NEW_NAME=$(jq -r '.name' "$pkg_file")
              
              if [[ "$OLD_NAME" == @* ]]; then
                # For packages that were already scoped
                BASE_NAME="${OLD_NAME#*@*/}"
                ORIGINAL_NAME="@${OLD_NAME#*@}"
              else
                # For regular packages
                BASE_NAME="$OLD_NAME"
                ORIGINAL_NAME="$OLD_NAME"
              fi
              
              echo "$ORIGINAL_NAME → $NEW_NAME" >> name_mapping.txt
            fi
          done
          
          cat name_mapping.txt || echo "No mapping file created"
          
          # Update all dependencies, devDependencies, and peerDependencies
          find packages -name "package.json" -not -path "*/node_modules/*" -type f | while read -r pkg_file; do
            echo "Updating dependencies in $pkg_file"
            
            # For each package in our name_mapping, update references
            while IFS=" → " read -r old_name new_name; do
              old_name=$(echo "$old_name" | tr -d '[:space:]')
              new_name=$(echo "$new_name" | tr -d '[:space:]')
              
              if [ -n "$old_name" ] && [ -n "$new_name" ]; then
                echo "  Replacing $old_name with $new_name"
                
                # Update all dependency types
                for dep_type in dependencies devDependencies peerDependencies; do
                  jq --arg old "$old_name" --arg new "$new_name" \
                    "if .$dep_type != null and .$dep_type[\"$old\"] != null then .$dep_type[\"$new\"] = .$dep_type[\"$old\"] | del(.$dep_type[\"$old\"]) else . end" \
                    "$pkg_file" > tmp.json && mv tmp.json "$pkg_file"
                done
              fi
            done < name_mapping.txt
          done
          
          echo "Step 2 complete: All dependency references updated"

      - name: Reinstall dependencies
        run: |
          echo "Reinstalling dependencies to update workspace references..."
          
          # Remove the yarn.lock file and node_modules to ensure a clean state
          # rm -f yarn.lock
          # rm -rf node_modules
          
          # Reinstall with updated package names
          yarn install

      - name: Update repository info
        run: |
          echo "Updating repository and publishConfig information..."
          
          find packages -name "package.json" -not -path "*/node_modules/*" -type f | while read -r pkg_file; do
            if ! grep -q "\"private\":\s*true" "$pkg_file"; then
              PKG_NAME=$(jq -r '.name' "$pkg_file")
              DIR_PATH=$(dirname "$pkg_file" | sed "s|$(pwd)/||")
              
              echo "Updating repository info for $PKG_NAME"
              
              # Add repository and publishConfig
              jq --arg url "https://github.com/vennyx-org/medusa.git" \
                 --arg dir "$DIR_PATH" \
                 '.repository = {type: "git", url: $url, directory: $dir} | .publishConfig = {registry: "https://npm.pkg.github.com", access: "restricted"}' \
                 "$pkg_file" > tmp.json && mv tmp.json "$pkg_file"
            fi
          done
          
          echo "Repository info update complete"

      - name: Build packages
        run: |
          echo "Building packages with updated names and dependencies..."
          yarn build || {
            echo "Failed to build packages. Showing error details:"
            echo "Contents of package.json files that might be causing issues:"
            find packages -name "package.json" -not -path "*/node_modules/*" -type f | xargs grep -l "@vennyx-org" | xargs cat
            exit 1
          }

      - name: Publish packages
        run: |
          echo "Starting package publishing process..."
          
          export SUCCESS_COUNT=0
          export FAIL_COUNT=0
          
          find packages -name "package.json" -not -path "*/node_modules/*" -type f | while read -r pkg_file; do
            PKG_DIR=$(dirname "$pkg_file")
            
            # Verify package.json exists and isn't private
            if [ -f "$pkg_file" ] && ! grep -q "\"private\":\s*true" "$pkg_file"; then
              # Get package info for logging
              PKG_NAME=$(jq -r '.name' "$pkg_file")
              PKG_VERSION=$(jq -r '.version' "$pkg_file")
              
              echo "Publishing $PKG_NAME@$PKG_VERSION from $PKG_DIR"
              
              # Navigate to package directory and publish
              pushd "$PKG_DIR" > /dev/null
              
              # Use NPM_CONFIG_LEGACY_PEER_DEPS to handle potential peer dependency issues
              if NPM_CONFIG_LEGACY_PEER_DEPS=true npm publish --access restricted --tag ${{ github.event.inputs.version || 'latest' }}; then
                echo "✅ Successfully published $PKG_NAME@$PKG_VERSION"
                export SUCCESS_COUNT=$((SUCCESS_COUNT+1))
              else
                echo "❌ Failed to publish $PKG_NAME"
                export FAIL_COUNT=$((FAIL_COUNT+1))
              fi
              
              popd > /dev/null
            fi
          done
          
          echo "Publishing complete: $SUCCESS_COUNT packages published successfully, $FAIL_COUNT failed"
          
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::warning::$FAIL_COUNT packages failed to publish"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}