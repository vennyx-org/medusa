name: Vennyx Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        default: "latest"
        description: "Which tag to use for publishing"
        required: true
        options:
          - latest
          - beta
          - alpha
          - next
  push:
    branches:
      - develop
      - vennyx
    paths-ignore:
      - "docs/**"
      - "www/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-publish:
    name: Build and Publish to Vennyx Organization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vennyx-org'

      - name: Create GitHub .npmrc
        run: |
          cat << EOF > .npmrc
          @vennyx-org:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          EOF

      - name: Install Dependencies
        run: yarn

      - name: Build packages
        run: yarn build

      - name: Update package.json files for GitHub Package Registry
        run: |
          for pkg_file in $(find packages -name "package.json" -not -path "*/node_modules/*" -type f); do
            echo "Processing $pkg_file"
            
            # Check if package is private
            IS_PRIVATE=$(grep -c "\"private\": true" $pkg_file || echo "0")
            
            if [ "$IS_PRIVATE" -eq "0" ]; then
              # Get the original name
              ORIGINAL_NAME=$(grep -o '"name": "[^"]*"' $pkg_file | cut -d'"' -f4)
              
              # Create temp file with updated package.json
              if [[ "$ORIGINAL_NAME" == @* ]]; then
                # For scoped packages
                NEW_NAME="@vennyx-org${ORIGINAL_NAME#*@*}"
              else
                # For regular packages
                NEW_NAME="@vennyx-org/$ORIGINAL_NAME"
              fi
              
              echo "Updating $ORIGINAL_NAME to $NEW_NAME"
              
              # Use jq to update the package.json (install if needed)
              if ! command -v jq &> /dev/null; then
                apt-get update && apt-get install -y jq
              fi
              
              DIR_PATH=$(dirname "$pkg_file" | sed "s|$(pwd)/||")
              
              jq --arg name "$NEW_NAME" \
                 --arg url "https://github.com/vennyx-org/medusa.git" \
                 --arg dir "$DIR_PATH" \
                 '.name = $name | .repository = {type: "git", url: $url, directory: $dir} | .publishConfig = {registry: "https://npm.pkg.github.com", access: "restricted"}' \
                 $pkg_file > temp.json && mv temp.json $pkg_file
              
              echo "Updated package.json for $ORIGINAL_NAME"
            fi
          done

      - name: Publish to GitHub Package Registry
        run: |
          for pkg_file in $(find packages -name "package.json" -not -path "*/node_modules/*" -type f); do
            ORIGINAL_DIR=$(pwd)
            PKG_DIR=$(dirname "$pkg_file")
            echo "Checking package in $PKG_DIR"
            
            cd "$PKG_DIR"
            
            # Check if package is private
            IS_PRIVATE=$(grep -c "\"private\": true" package.json || echo "0")
            
            if [ "$IS_PRIVATE" -eq "0" ]; then
              echo "Publishing from $PKG_DIR"
              npm publish --access restricted --tag ${{ github.event.inputs.version || 'latest' }}
            fi
            
            cd "$ORIGINAL_DIR"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}