name: Vennyx Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        default: "latest"
        description: "Which tag to use for publishing"
        required: true
        options:
          - latest
          - beta
          - alpha
          - next
  push:
    branches:
      - vennyx-2.11.3
    paths-ignore:
      - "docs/**"
      - "www/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-publish:
    name: Build and Publish to Vennyx Organization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@vennyx-org"

      - name: Create GitHub .npmrc
        run: |
          cat << EOF > .npmrc
          @vennyx-org:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          EOF

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Build original packages
        run: |
          # Build packages with original names first
          yarn
          yarn build

      - name: Define common timestamp
        run: |
          echo "COMMON_TIMESTAMP=$(date +%s)" >> $GITHUB_ENV

      - name: List and prepare publishable packages
        run: |
          echo "Creating directory for publishable packages..."
          mkdir -p ./publishable-packages

          # Find all non-private packages and prepare them for publishing
          find packages -name "package.json" -not -path "*/node_modules/*" -type f | while read -r pkg_file; do
            # Skip private packages
            if grep -q "\"private\":\s*true" "$pkg_file"; then
              continue
            fi
            
            PKG_DIR=$(dirname "$pkg_file")
            PKG_NAME=$(jq -r '.name' "$pkg_file")
            PKG_VERSION=$(jq -r '.version' "$pkg_file")
            
            if [ -z "$PKG_NAME" ] || [ "$PKG_NAME" = "null" ]; then
              echo "Warning: Invalid package name in $pkg_file, skipping"
              continue
            fi
            
            echo "Preparing package: $PKG_NAME@$PKG_VERSION"
            
            # Create a clean directory for each package
            TARGET_DIR="./publishable-packages/$(basename "$PKG_DIR")"
            mkdir -p "$TARGET_DIR"
            
            # Copy the built files (lib, dist, etc.)
            if [ -d "$PKG_DIR/lib" ]; then
              cp -r "$PKG_DIR/lib" "$TARGET_DIR/"
            fi
            if [ -d "$PKG_DIR/dist" ]; then
              cp -r "$PKG_DIR/dist" "$TARGET_DIR/"
            fi
            
            # Copy essential files
            cp "$pkg_file" "$TARGET_DIR/package.json"
            if [ -f "$PKG_DIR/README.md" ]; then
              cp "$PKG_DIR/README.md" "$TARGET_DIR/"
            fi
            if [ -f "$PKG_DIR/LICENSE" ]; then
              cp "$PKG_DIR/LICENSE" "$TARGET_DIR/"
            fi
            
            # Update package.json with vennyx-org scope
            if [[ "$PKG_NAME" == @* ]]; then
              # For scoped packages like @medusajs/utils -> @vennyx-org/utils
              PACKAGE_NAME_WITHOUT_SCOPE=$(echo "$PKG_NAME" | sed 's/^@[^\/]*\///')
              NEW_NAME="@vennyx-org/$PACKAGE_NAME_WITHOUT_SCOPE"
            else
              # For regular packages
              NEW_NAME="@vennyx-org/$PKG_NAME"
            fi
            
            # Update package.json (remove lifecycle scripts since build is already done)
            jq --arg name "$NEW_NAME" \
               --arg url "https://github.com/vennyx-org/medusa.git" \
               --arg dir "$PKG_DIR" \
               --arg buildnum "$COMMON_TIMESTAMP" \
               '.name = $name |
                .version = .version + "-" + $buildnum |
                .repository = {type: "git", url: $url, directory: $dir} |
                .publishConfig = {registry: "https://npm.pkg.github.com", access: "restricted"} |
                del(.scripts.prepare, .scripts.postinstall)' \
               "$TARGET_DIR/package.json" > "$TARGET_DIR/package.json.new" && \
                mv "$TARGET_DIR/package.json.new" "$TARGET_DIR/package.json"
            
            echo "Prepared $NEW_NAME (original: $PKG_NAME) in $TARGET_DIR"
          done

          echo "Package preparation complete."

      - name: Publish prepared packages
        run: |
          echo "Publishing prepared packages..."

          SUCCESS_COUNT=0
          FAIL_COUNT=0
          SUCCESS_PACKAGES=()
          FAILED_PACKAGES=()

          while IFS= read -r pkg_dir; do
            if [ -f "$pkg_dir/package.json" ]; then
              PKG_NAME=$(jq -r '.name' "$pkg_dir/package.json")
              PKG_VERSION=$(jq -r '.version' "$pkg_dir/package.json")

              echo "Publishing $PKG_NAME@$PKG_VERSION from $pkg_dir"

              pushd "$pkg_dir" > /dev/null

              if npm publish --ignore-scripts --access restricted --tag ${{ github.event.inputs.version || 'latest' }}; then
                echo "✅ Successfully published $PKG_NAME@$PKG_VERSION"
                ((SUCCESS_COUNT++))
                SUCCESS_PACKAGES+=("$PKG_NAME@$PKG_VERSION")
              else
                echo "❌ Failed to publish $PKG_NAME"
                ((FAIL_COUNT++))
                FAILED_PACKAGES+=("$PKG_NAME@$PKG_VERSION")
              fi

              popd > /dev/null
            fi
          done < <(find ./publishable-packages -type d -maxdepth 1 -mindepth 1)

          # Save results to files for next step
          mkdir -p .github-outputs
          printf "%s\n" "${SUCCESS_PACKAGES[@]}" > .github-outputs/success-packages.txt
          printf "%s\n" "${FAILED_PACKAGES[@]}" > .github-outputs/failed-packages.txt
          echo "$SUCCESS_COUNT" > .github-outputs/success-count.txt
          echo "$FAIL_COUNT" > .github-outputs/fail-count.txt

          echo ""
          echo "========================================="
          echo "Publishing Summary:"
          echo "  ✅ Success: $SUCCESS_COUNT packages"
          echo "  ❌ Failed: $FAIL_COUNT packages"
          echo "========================================="

          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo ""
            echo "Failed packages:"
            for pkg in "${FAILED_PACKAGES[@]}"; do
              echo "  - $pkg"
            done
            echo "::error::$FAIL_COUNT packages failed to publish"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Publish Summary Report
        if: always()
        run: |
          echo "========================================"
          echo "📦 VENNYX PACKAGE PUBLISHING REPORT"
          echo "========================================"
          echo ""

          SUCCESS_COUNT=$(cat .github-outputs/success-count.txt 2>/dev/null || echo "0")
          FAIL_COUNT=$(cat .github-outputs/fail-count.txt 2>/dev/null || echo "0")
          TOTAL=$((SUCCESS_COUNT + FAIL_COUNT))

          echo "📈 Statistics:"
          echo "  Total Packages: $TOTAL"
          echo "  ✅ Successful: $SUCCESS_COUNT"
          echo "  ❌ Failed: $FAIL_COUNT"

          if [ "$SUCCESS_COUNT" -gt 0 ]; then
            SUCCESS_RATE=$(awk "BEGIN {printf \"%.1f\", ($SUCCESS_COUNT/$TOTAL)*100}")
            echo "  📊 Success Rate: ${SUCCESS_RATE}%"
          fi

          echo ""

          if [ "$SUCCESS_COUNT" -gt 0 ]; then
            echo "✅ Successfully Published Packages ($SUCCESS_COUNT):"
            echo "────────────────────────────────────────"
            cat .github-outputs/success-packages.txt | while read pkg; do
              echo "  ✓ $pkg"
            done
            echo ""
          fi

          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "❌ Failed Packages ($FAIL_COUNT):"
            echo "────────────────────────────────────────"
            cat .github-outputs/failed-packages.txt | while read pkg; do
              echo "  ✗ $pkg"
            done
            echo ""
          fi

          echo "========================================"

          # Create job summary for GitHub UI
          {
            echo "## 📦 Vennyx Package Publishing Report"
            echo ""
            echo "### 📈 Statistics"
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Total Packages | $TOTAL |"
            echo "| ✅ Successful | $SUCCESS_COUNT |"
            echo "| ❌ Failed | $FAIL_COUNT |"

            if [ "$SUCCESS_COUNT" -gt 0 ]; then
              echo ""
              echo "### ✅ Successfully Published Packages"
              cat .github-outputs/success-packages.txt | while read pkg; do
                echo "- \`$pkg\`"
              done
            fi

            if [ "$FAIL_COUNT" -gt 0 ]; then
              echo ""
              echo "### ❌ Failed Packages"
              cat .github-outputs/failed-packages.txt | while read pkg; do
                echo "- \`$pkg\`"
              done
            fi
          } >> $GITHUB_STEP_SUMMARY
